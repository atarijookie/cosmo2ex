# Release - on pushing a version tag:
#   git tag v1.2.3 && git push origin v1.2.3
#
# Runs CI first, then builds in parallel:
#   - the release tarballs (release/build.sh) + install.sh + SHA256SUMS, and the Windows and macOS zips - their
#     programs are built first, in Cygwin (release/builder/build_windows.sh) and on macOS
#     (release/builder/build_macos.sh), the rest is the same as in the tarballs
#   - the docker image for all platforms, pushed to ghcr.io/<owner>/cosmo2ex as :1.2.3 and :latest
#   - the Pico firmwares (firmware/build.sh), in the ghcr.io/<owner>/ce-pico-builder image - that one is
#     tagged with the hash of firmware/Dockerfile, and built + pushed only when that file changed
#   - the Android app (android/build.sh), once - before the tarballs, zips and images, which all have it inside
# and finally creates the GitHub release with the tarballs, firmwares and the Android app attached. If the release already exists
# (made on the GitHub page, which also creates the tag), the files are uploaded to it instead.
#
# The macOS zip is optional: when the macOS job fails or gets no runner, the release is made without it (re-run that
# job later - the github-release job then adds the zip to the existing release).
#
# A tag with a suffix (v1.2.3-rc1) makes a pre-release, and doesn't move the :latest image tag.
# The image package on ghcr.io is private after the first push - make it public once, in the
# package settings on github.com, so devices can pull it without logging in.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read                            # CI pulls the ce-pico-builder image

  windows:
    # ce_cores.exe + cygwin1.dll + licenses, webserver.exe, ce_run.exe, ce_media.exe, ce_browser.exe - packed into the zip by the tarballs job
    needs: ci
    runs-on: windows-2022
    defaults:
      run:
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -eo pipefail -o igncr '{0}'
    steps:
      - name: Keep LF line endings                # Cygwin's make and sh don't like CRLF
        shell: pwsh
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: "*/go.sum"                  # webserver, ce_browser

      - uses: cygwin/cygwin-install-action@v4
        with:
          packages: gcc-g++ make curl

      - name: Build Windows programs
        run: release/builder/build_windows.sh . out/windows

      - uses: actions/upload-artifact@v7
        with:
          name: windows-bin
          path: out/windows/
          if-no-files-found: error

  macos:
    # universal ce_cores, webserver, ce_run, ce_media, ce_browser (arm64 + x86_64) - packed into the zip by the tarballs job
    needs: ci
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: "*/go.sum"                  # webserver, ce_browser

      - name: Build macOS programs
        run: release/builder/build_macos.sh . out/macos

      - uses: actions/upload-artifact@v7
        with:
          name: macos-bin
          path: out/macos/
          if-no-files-found: error

  android:
    # the Android floppy app, the same APK goes into the tarballs, zips and docker images
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build Android app
        run: VERSION="${GITHUB_REF_NAME#v}" android/build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: android-app
          path: webserver/static/app/ce_floppy.apk
          if-no-files-found: error

  tarballs:
    needs: [ci, windows, macos, android]
    # also when macOS failed / was cancelled - then without the macOS zip
    if: ${{ !cancelled() && needs.ci.result == 'success' && needs.windows.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8        # served by the webserver, so it goes in with its static files
        with:
          name: android-app
          path: webserver/static/app

      - uses: actions/download-artifact@v8
        with:
          name: windows-bin
          path: windows-bin

      - uses: actions/download-artifact@v8
        if: ${{ needs.macos.result == 'success' }}
        with:
          name: macos-bin
          path: macos-bin

      - name: Install m68k-atari-mint toolchain
        run: |
          sudo add-apt-repository -y ppa:vriviere/ppa
          sudo apt-get install -y --no-install-recommends cross-mint-essential

      - name: Build release tarballs + Windows and macOS zips
        env:
          MACOS_RESULT: ${{ needs.macos.result }}
          ANDROID_APK: webserver/static/app/ce_floppy.apk
        run: |
          targets="amd64 arm64 armhf i386 windows"
          if [ "$MACOS_RESULT" = "success" ]; then
            targets="$targets macos"
          else
            echo "::warning::macOS build $MACOS_RESULT - the release is made without the macOS zip"
          fi
          VERSION="${GITHUB_REF_NAME#v}" WINDOWS_BIN="$PWD/windows-bin" MACOS_BIN="$PWD/macos-bin" \
            release/build.sh $targets

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/out/
          if-no-files-found: error

  images:
    needs: [ci, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8        # served by the webserver, so it goes in with its static files
        with:
          name: android-app
          path: webserver/static/app

      - name: Install m68k-atari-mint toolchain
        run: |
          sudo add-apt-repository -y ppa:vriviere/ppa
          sudo apt-get install -y --no-install-recommends cross-mint-essential

      - name: Build Atari drivers for the config drive
        run: docker/build_drivers.sh

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tags :1.2.3 (+ :latest for non pre-releases), labels incl. org.opencontainers.image.source,
      # which links the package to this repository
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/cosmo2ex
          tags: type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/386
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ce
          cache-to: type=gha,scope=ce,mode=max

      # full variant: + ffmpeg and Chrome for the video / audio players and the web browser - tags :1.2.3-full
      # (+ :latest-full); no arm/v6 (Debian has no packages for it)
      - id: meta-full
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/cosmo2ex
          tags: type=semver,pattern={{version}}
          flavor: |
            suffix=-full,onlatest=true

      - name: Build and push the full variant
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: full
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/386
          push: true
          tags: ${{ steps.meta-full.outputs.tags }}
          labels: ${{ steps.meta-full.outputs.labels }}
          cache-from: |
            type=gha,scope=ce
            type=gha,scope=ce-full
          cache-to: type=gha,scope=ce-full,mode=max

  pico-builder:
    # pushes ghcr.io/<owner>/ce-pico-builder:<hash of firmware/Dockerfile> (+ :latest), unless it's there already
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - id: tag
        run: |
          repo="ghcr.io/$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')/ce-pico-builder"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:$(sha256sum firmware/Dockerfile | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: check
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "$IMAGE already exists, not rebuilding it"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: firmware
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ steps.tag.outputs.repo }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  firmware:
    needs: pico-builder
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Pico firmwares
        env:
          PICO_BUILDER_IMAGE: ${{ needs.pico-builder.outputs.image }}
        run: |
          docker pull "$PICO_BUILDER_IMAGE"
          firmware/build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: firmware/out/*.uf2
          if-no-files-found: error

  github-release:
    needs: [tarballs, images, firmware, android]
    # tarballs may have run without the macOS zip (see there), the rest must be fine
    if: ${{ !cancelled() && needs.tarballs.result == 'success' && needs.images.result == 'success' && needs.firmware.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: out

      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: out

      - uses: actions/download-artifact@v8
        with:
          name: android-app
          path: out

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/cosmo2ex
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          (cd out && sha256sum ce-*.tar.gz ce-*.zip install.sh *.uf2 *.apk > SHA256SUMS)

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # made on the GitHub page (or by an earlier run) - keep its title and notes, add / replace the files
            echo "Release $GITHUB_REF_NAME exists, uploading the files to it"
            gh release upload "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --notes "Docker image: \`docker pull $IMAGE:$version\`" \
              $prerelease
          fi
