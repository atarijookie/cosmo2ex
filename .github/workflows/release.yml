# Release - on pushing a version tag:
#   git tag v1.2.3 && git push origin v1.2.3
#
# Runs CI first, then builds in parallel:
#   - the release tarballs (release/build.sh) + install.sh + SHA256SUMS
#   - the docker image for all platforms, pushed to ghcr.io/<owner>/ce-atari as :1.2.3 and :latest
# and finally creates the GitHub release with the tarballs attached.
#
# A tag with a suffix (v1.2.3-rc1) makes a pre-release, and doesn't move the :latest image tag.
# The image package on ghcr.io is private after the first push - make it public once, in the
# package settings on github.com, so devices can pull it without logging in.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  tarballs:
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install m68k-atari-mint toolchain
        run: |
          sudo add-apt-repository -y ppa:vriviere/ppa
          sudo apt-get install -y --no-install-recommends cross-mint-essential

      - name: Build release tarballs
        run: VERSION="${GITHUB_REF_NAME#v}" release/build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/out/
          if-no-files-found: error

  images:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Install m68k-atari-mint toolchain
        run: |
          sudo add-apt-repository -y ppa:vriviere/ppa
          sudo apt-get install -y --no-install-recommends cross-mint-essential

      - name: Build Atari drivers for the config drive
        run: docker/build_drivers.sh

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tags :1.2.3 (+ :latest for non pre-releases), labels incl. org.opencontainers.image.source,
      # which links the package to this repository
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/ce-atari
          tags: type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/386
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ce
          cache-to: type=gha,scope=ce,mode=max

  github-release:
    needs: [tarballs, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: out

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/ce-atari
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --notes "Docker image: \`docker pull $IMAGE:$version\`" \
            $prerelease
