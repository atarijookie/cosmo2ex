        <script type="text/javascript">
        //unfortunately we have to support IE<10, so decide on zepto/jquery here
    		document.write('<script type="text/javascript" src=js/' + ('__proto__' in {} ? 'zepto' : 'jquery') + '.js><\/script>');
    		document.write('<script type="text/javascript"">var jQuery=Zepto;<\/script>');
//        document.write('<link rel="stylesheet" type="text/css" href="css/combined.css">');
        document.write('<link rel="stylesheet" type="text/css" href="css/style.css">');
    		</script>
        <script type="text/javascript">
    		document.write('<script type="text/javascript" src=js/config.js><\/script>');
    	  </script>
        <script type='text/javascript'>
          var dir = "/home";
          var selectedFile = "";
          var currentImagePath = "";
          var defaultDir = "";          // where the selector starts without an image - FLOPPY_IMAGES_DIR

          function getURLParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            var results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
          }

          function splitPath(p) {
            if (!p) return { dir: "", name: "" };
            var parts = p.split('/');
            var name = parts.pop() || "";
            var d = parts.join('/');
            if (d === "") { d = "/"; }
            return { dir: d, name: name };
          }

          var displayChanges = 0;   // see pollCurrentImage()

          function updateDisplay(path) {
            displayChanges++;
            currentImagePath = path || "";
            var info = splitPath(currentImagePath);
            document.getElementById('image-name').textContent = 'File: ' + (info.name || 'No image selected');
            document.getElementById('image-path').textContent = 'Path: ' + (info.dir || '');
          }

          function loadCurrentImage() {
            var mac = getURLParameter('mac');
            if (!mac) {
              updateDisplay("");
              document.getElementById('image-name').textContent = 'Error: No MAC address specified';
              return;
            }
            fetch('/fdd/' + encodeURIComponent(mac) + '/image', { method: 'GET' })
              .then(function(res) { return res.json(); })
              .then(function(data) {
                defaultDir = data.defaultDir || "";
                updateDisplay(data.image || "");
              })
              .catch(function(err) {
                console.log('Error fetching image:', err);
                updateDisplay("");
              });
          }

          // The image can change elsewhere (Android app, buttons on the device), so keep asking while the page is visible.
          // Next request only after the previous one has finished. An answer to a request sent before a button on this page
          // has changed the image is old, so it's ignored. Failed request: keep what's shown, server_check.js tells the user.
          function pollCurrentImage() {
            var mac = getURLParameter('mac');
            if (!mac || document.hidden) {
              setTimeout(pollCurrentImage, 1000);
              return;
            }
            var changesAtStart = displayChanges;
            fetch('/fdd/' + encodeURIComponent(mac) + '/image', { method: 'GET', redirect: 'error' })
              .then(function(res) {
                if (!res.ok) { throw new Error('GET failed ' + res.status); }
                return res.json();
              })
              .then(function(data) {
                var image = data.image || "";
                if (changesAtStart === displayChanges && image !== currentImagePath) {
                  updateDisplay(image);
                }
              })
              .catch(function() {})
              .then(function() { setTimeout(pollCurrentImage, 1000); });
          }

          var dirRequestNo = 0;   // only the answer to the last request is shown - typing in search sends many
          var searchTimer = null;
          var folderSelectMode = false;   // the selector picks a folder for a new image, not a file
          var newImageFolder = "";

          // going into another folder - without the search of the previous one
          function openDir(new_path) {
            clearTimeout(searchTimer);
            document.getElementById('search').value = '';
            getDirContent(new_path);
          }

          // search typed - list again, after a short pause in typing
          function onSearchInput() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(function() { getDirContent(dir); }, 250);
          }

          // .st / .msa / .stx, any case - like isFloppyImageName() in fdd.go
          function isFloppyImageName(name) {
            return /^.+\.(st|msa|stx)$/i.test(name);
          }

          function getDirContent(new_path) {
            selectedFile = "";
            dir = new_path;
            document.getElementById('currentPath').textContent = dir;

            var query = document.getElementById('search').value.trim();
            var url = '/host/dir?path=' + encodeURIComponent(new_path);
            if (query) {
              url += '&q=' + encodeURIComponent(query);     // backend: names containing it, case insensitive
            }
            var requestNo = ++dirRequestNo;

            $.ajax({
              url: url,
              type: 'GET',
              dataType: 'json',
              success: function (data) {
                if (requestNo != dirRequestNo) {
                  return;
                }
                var dirs = data.dirs;
                var files = data.files.filter(isFloppyImageName);   // only floppy images, no .zip, .lock, ...

                const itemList = document.getElementById('itemList');
                itemList.innerHTML = '';

                if (query && dirs.length == 0 && files.length == 0) {
                  const div = document.createElement('div');
                  div.className = 'no-match';
                  div.textContent = "Nothing with '" + query + "' in this folder";
                  itemList.appendChild(div);
                }

                dirs.forEach(item => {
                  var fullpath = (new_path == "/") ? ("/" + item) : (new_path + "/" + item);
                  const div = document.createElement('div');
                  div.className = 'item';
                  div.textContent = "[" + item + "]";
                  div.onclick = () => openDir(fullpath);
                  itemList.appendChild(div);
                });

                files.forEach(item => {
                  var fullpath = (new_path == "/") ? ("/" + item) : (new_path + "/" + item);
                  const div = document.createElement('div');
                  div.className = folderSelectMode ? 'item item-only-shown' : 'item';
                  div.textContent = item;
                  if (!folderSelectMode) {
                    div.onclick = () => onFileSelected(fullpath);
                  }
                  itemList.appendChild(div);
                });

                // the inserted image is in this folder - select it and scroll to it, otherwise start at the top
                var current = splitPath(currentImagePath);
                var currentItem = null;
                if (!folderSelectMode && current.dir == new_path && files.indexOf(current.name) >= 0) {
                  selectedFile = currentImagePath;
                  currentItem = selectByText(selectedFile, true);
                }
                if (currentItem) {
                  currentItem.scrollIntoView({ block: 'center' });
                } else {
                  itemList.scrollTop = 0;
                }
              },
              error: function (xhr) {
                console.log("Error: " + xhr.statusText);
              },
            })
          }

          function onFileSelected(filePath) {
            if (filePath == selectedFile) {
              selectByText(selectedFile, false);
              selectedFile = "";
            } else {
              selectByText(selectedFile, false);
              selectedFile = filePath;
              selectByText(filePath, true);
            }
          }

          // returns the item, null if not found
          function selectByText(fullFilePath, selectNotUnselect) {
            var items = document.getElementsByClassName("item");
            var fileName = fullFilePath.split('/').pop();
            for (var x = 0; x < items.length; x++) {
              var item = items[x];
              if (item.textContent == fileName || item.textContent == "[" + fileName + "]") {
                item.style.backgroundColor = selectNotUnselect ? "#cccccc" : "#ffffff";
                return item;
              }
            }
            return null;
          }

          function openSelector() {
            var info = splitPath(currentImagePath);
            dir = info.dir || defaultDir || "/home";
            showSelector(false, dir);
          }

          function showSelector(forFolder, startDir) {
            folderSelectMode = forFolder;
            document.getElementById('selector-ok').textContent = forFolder ? 'Use this folder' : 'OK';
            openDir(startDir);
            var overlay = document.getElementsByClassName('container-file-selector')[0];
            if (overlay) { overlay.style.display = 'flex'; }
            $("[name=file-selector]").show();
            document.getElementById('search').focus();
          }

          function goUp() {
            const parts = dir.split('/');
            if (parts.length > 1) {
              parts.pop();
            }
            var new_path = parts.join('/');
            if (new_path == "") {
              new_path = "/";
            }
            openDir(new_path);
          }

          function hideSelector() {
            $("[name=file-selector]").hide();
            var overlay = document.getElementsByClassName('container-file-selector')[0];
            if (overlay) { overlay.style.display = 'none'; }
            folderSelectMode = false;
          }

          function onSelectorCancel() {
            hideSelector();
          }

          function onSelectorOK() {
            if (folderSelectMode) {
              setNewImageFolder(dir);
              hideSelector();
              return;
            }
            if (!selectedFile) {
              return;
            }
            var ext = selectedFile.split('.').pop().toLowerCase();
            if(ext != 'msa' && ext != 'st' && ext != 'stx') {
              alert("File extension '" + ext + "' is not supported floppy image format - .msa / .st / .stx");
              return;
            }
            saveImage(selectedFile);
            hideSelector();
          }

          // empty image - ready for the ST to use, without formatting it
          function setNewImageFolder(path) {
            newImageFolder = path;
            document.getElementById('new-image-folder').textContent = path;
          }

          function openNewImageDialog() {
            setNewImageFolder(splitPath(currentImagePath).dir || defaultDir || "/home");
            document.getElementById('new-image-error').textContent = '';
            document.getElementById('new-image-overlay').style.display = 'flex';
            document.getElementById('new-image-name').focus();
          }

          function closeNewImageDialog() {
            document.getElementById('new-image-overlay').style.display = 'none';
          }

          function createNewImage(overwrite) {
            var mac = getURLParameter('mac');
            var error = document.getElementById('new-image-error');
            if (!mac) {
              error.textContent = 'No MAC address specified';
              return;
            }
            var insert = document.getElementById('new-image-insert').checked;
            error.textContent = '';
            fetch('/fdd/' + encodeURIComponent(mac) + '/image/new', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                dir: newImageFolder,
                name: document.getElementById('new-image-name').value,
                tracks: parseInt(document.getElementById('new-image-tracks').value, 10),
                sectors: parseInt(document.getElementById('new-image-sectors').value, 10),
                sides: parseInt(document.getElementById('new-image-sides').value, 10),
                insert: insert,
                overwrite: overwrite === true
              })
            }).then(function(res) {
              if (res.status == 409) {      // exists - maybe it should be overwritten with an empty one, e.g. during tests
                return res.text().then(function(t) {
                  if (confirm(t.trim() + '\n\nOverwrite it? Everything in it will be lost.')) {
                    createNewImage(true);
                  }
                  return null;
                });
              }
              if (!res.ok) {
                return res.text().then(function(t) { throw new Error(t.trim() || ('POST failed ' + res.status)); });
              }
              return res.json();
            }).then(function(data) {
              if (!data) {                  // not overwritten, or the second try handled it
                return;
              }
              closeNewImageDialog();
              if (insert) {
                updateDisplay(data.image);
              }
              var created = document.getElementById('new-image-created');
              created.textContent = 'created: ' + data.image;
              created.style.display = 'block';
              setTimeout(function() { created.style.display = 'none'; }, 5000);
            }).catch(function(err) {
              console.log('Error creating image:', err);
              error.textContent = err.message;
            });
          }

          function saveImage(path) {
            var mac = getURLParameter('mac');
            if (!mac) {
              alert('Error: No MAC address specified');
              return;
            }
            fetch('/fdd/' + encodeURIComponent(mac) + '/image', {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ image: path })
            }).then(function(res) {
              if (!res.ok) { throw new Error('PUT failed ' + res.status); }
              updateDisplay(path);
            }).catch(function(err) {
              console.log('Error saving image:', err);
              alert('Error saving image: ' + err);
            });
          }

          function stepImage(direction) {
            var mac = getURLParameter('mac');
            if (!mac) {
              alert('Error: No MAC address specified');
              return;
            }
            var endpoint = direction > 0 ? '/fdd/' + encodeURIComponent(mac) + '/image/next'
                                         : '/fdd/' + encodeURIComponent(mac) + '/image/prev';
            fetch(endpoint, { method: 'GET' })
              .then(function(res) {
                if (!res.ok) {
                  return res.text().then(function(t) { throw new Error(t.trim() || ('GET failed ' + res.status)); });
                }
                return res.json();
              })
              .then(function(data) {
                updateDisplay(data.image || "");
              })
              .catch(function(err) {
                console.log('Error stepping image:', err);
                alert('Error stepping image: ' + err);
              });
          }

          function ejectImage() {
            var mac = getURLParameter('mac');
            if (!mac) {
              alert('Error: No MAC address specified');
              return;
            }
            fetch('/fdd/' + encodeURIComponent(mac) + '/image', {
              method: 'DELETE'
            }).then(function(res) {
              if (!res.ok) { throw new Error('DELETE failed ' + res.status); }
              updateDisplay("");
            }).catch(function(err) {
              console.log('Error ejecting image:', err);
              alert('Error ejecting image: ' + err);
            });
          }

          document.addEventListener('DOMContentLoaded', function() {
            var btn = document.getElementById('select-image');
            if (btn) {
              btn.onclick = openSelector;
            }
            var ejectBtn = document.getElementById('eject-image');
            if (ejectBtn) {
              ejectBtn.onclick = ejectImage;
            }
            var newBtn = document.getElementById('new-image');
            if (newBtn) {
              newBtn.onclick = openNewImageDialog;
            }
            var prevBtn = document.getElementById('prev-image');
            if (prevBtn) {
              prevBtn.onclick = function() { stepImage(-1); };
            }
            var nextBtn = document.getElementById('next-image');
            if (nextBtn) {
              nextBtn.onclick = function() { stepImage(+1); };
            }
          });

          // device setting - stored on the device too (sent by the core now, or when the device connects)
          function loadFddSettings() {
            var mac = getURLParameter('mac');
            var box = document.getElementById('beep-on-step');
            if (!mac || !box) return;
            fetch('/fdd/' + encodeURIComponent(mac) + '/settings', { method: 'GET' })
              .then(function(res) {
                if (!res.ok) { throw new Error('GET failed ' + res.status); }
                return res.json();
              })
              .then(function(data) {
                box.checked = (data.beep_on_step === 1);
                box.disabled = false;
              })
              .catch(function(err) {
                console.log('Error loading floppy settings:', err);
              });
          }

          function saveBeepOnStep() {
            var mac = getURLParameter('mac');
            var box = document.getElementById('beep-on-step');
            var saved = document.getElementById('beep-saved');
            if (!mac || !box) return;
            saved.style.display = 'none';
            fetch('/fdd/' + encodeURIComponent(mac) + '/settings', {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ beep_on_step: box.checked ? 1 : 0 })
            }).then(function(res) {
              if (!res.ok) { throw new Error('PUT failed ' + res.status); }
              saved.style.display = 'inline';
              setTimeout(function() { saved.style.display = 'none'; }, 2000);
            }).catch(function(err) {
              box.checked = !box.checked;       // not saved - show what's stored
              console.log('Error saving floppy settings:', err);
              alert('Error saving setting: ' + err);
            });
          }

          window.onload = function() {
            $("[name=file-selector]").hide();
            var overlay = document.getElementsByClassName('container-file-selector')[0];
            if (overlay) { overlay.style.display = 'none'; }
            loadCurrentImage();
            setTimeout(pollCurrentImage, 1000);
            loadFddSettings();
            var beepBox = document.getElementById('beep-on-step');
            if (beepBox) { beepBox.onchange = saveBeepOnStep; }
          }

          // Logout function
          function logout() {
            fetch('/auth/logout', {
              method: 'POST',
              credentials: 'include'
            })
            .then(function(response) {
              // Clear localStorage if token is stored there
              if (localStorage.getItem('auth_token')) {
                localStorage.removeItem('auth_token');
              }
              // Redirect to login page
              window.location.href = '/login.html';
            })
            .catch(function(error) {
              console.error('Logout error:', error);
              // Redirect to login page even on error
              window.location.href = '/login.html';
            });
          }
        </script>

        <style>
          body {
            margin: 0;
            padding: 20px 0;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            min-height: 100vh;
            font-family: sans-serif;
          }
          body .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 30px;

            position: relative;
          }

          .container-file-selector, #new-image-overlay {
            z-index: 1000;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;

            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
          }

          .file-selector {
            width: 400px;
            height: 500px;
            background: white;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
          }

          .top-bar {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px solid #ddd;
            background: #fafafa;
          }

          .path {
            flex-grow: 1;
            font-size: 14px;
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .top-bar button {
            margin-left: 10px;
            padding: 6px 12px;
            cursor: pointer;
          }

          .search-bar {
            padding: 8px 16px;
            border-bottom: 1px solid #ddd;
          }

          .search-bar input {
            width: 100%;
            box-sizing: border-box;
            padding: 6px 8px;
            font-size: 14px;
          }

          .no-match {
            padding: 12px 16px;
            color: #888;
          }

          .item-list {
            flex-grow: 1;
            overflow-y: auto;
          }

          .item {
            padding: 12px 16px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
          }

          .item:hover {
            background-color: #f9f9f9;
          }

          .item-only-shown {
            color: #999;
            cursor: default;
          }

          .new-image-dialog {
            width: 400px;
            max-width: 90vw;
            padding: 16px;
            box-sizing: border-box;
            background: white;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
          }

          .new-image-dialog label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
          }

          .new-image-dialog label > span {
            width: 70px;
            flex-shrink: 0;
          }

          .new-image-dialog select, .new-image-dialog input[type=text] {
            flex-grow: 1;
            min-width: 0;
            box-sizing: border-box;
            margin: 0;
            height: auto;
            padding: 6px 8px;
          }

          #new-image-folder {
            flex-grow: 1;
            min-width: 0;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          #new-image-error {
            color: #c00;
            font-size: 14px;
          }

          .bottom-bar {
            display: flex;
            justify-content: flex-end;
            padding: 10px 16px;
            border-top: 1px solid #ddd;
            background: #fafafa;
          }

          .bottom-bar button {
            margin-left: 10px;
            padding: 6px 12px;
            cursor: pointer;
          }
          #logout-button, #settings-button {
            position: absolute;

            right: 15px;

            cursor: pointer;

          #logout-button:hover, #settings-button:hover {
            background-color: #555;

          .footer-links {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            font-size: 14px;
            color: #666;

          .footer-links a {
            color: #0066cc;
            text-decoration: none;
            margin: 0 10px;
          }
          .footer-links a:hover {
            text-decoration: underline;
          }
          .footer-links span {
            color: #999;
            margin: 0 5px;
          }
        </style>
      </head>
    <body>
    <div class="container">
    <div id="account-buttons">
        <button id="settings-button" onclick="window.location.href='/settings.html'">Settings</button>
        <button id="logout-button" onclick="logout()">Logout</button>
    </div>
        <div class="row">
            <div class="span12" style="display: flex; flex-direction: column; align-items: center;">
                <div id="breadcrumbs-container" style="width: 100%;"></div>
                <script src="js/breadcrumbs.js"></script>
                <div style="display: flex; flex-direction: column; align-items: flex-start; max-width: 600px; width: 100%;">
                  <h2 style="margin: 0; align-self: flex-start;">Cosmo2ex</h2>
                  <h3 style="margin: 0; align-self: flex-start;">Floppy</h3>
                  <p style="margin: 0; align-self: flex-start;">Select a disk image (*.ST, *.MSA, *.STX) and upload it to your Cosmo2ex. </p>
                </div>
            </div>
        </div>

        <div style="margin-top: 15px; display: flex; flex-direction: column; align-items: center;">
          <div style="display: flex; flex-direction: column; align-items: flex-start; max-width: 600px; width: 100%;">
            <div id="image-name" style="font-size: 18px; font-weight: bold;">Loading...</div>
            <div id="image-path" style="font-size: 13px; color: #555; margin-bottom: 10px;"></div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%;">
              <div style="display: flex; align-items: center; gap: 10px;">
                <button id="prev-image" style="padding: 10px 14px; font-size: 16px;">&lt;</button>
                <button id="select-image" style="padding: 10px 18px; font-size: 16px; min-width: 90px;">Select</button>
                <button id="next-image" style="padding: 10px 14px; font-size: 16px;">&gt;</button>
              </div>
              <div style="display: flex; align-items: center; justify-content: center;">
                <button id="eject-image" style="padding: 10px 18px; font-size: 16px; min-width: 90px;">Eject</button>
              </div>
              <div style="display: flex; align-items: center; justify-content: center;">
                <button id="new-image" style="padding: 10px 18px; font-size: 16px; min-width: 90px;">Create empty image</button>
              </div>
              <div id="new-image-created" style="display: none; color: #3baf16; font-size: 14px; word-break: break-all;"></div>
            </div>
          </div>
        </div>

        <div style="margin-top: 30px; display: flex; flex-direction: column; align-items: center;">
          <div style="display: flex; flex-direction: column; align-items: flex-start; max-width: 600px; width: 100%;">
            <label style="display: flex; align-items: center; gap: 8px; font-size: 16px; cursor: pointer;">
              <input type="checkbox" id="beep-on-step" disabled>
              Beep on every floppy head step
              <span id="beep-saved" style="display: none; color: #3baf16; font-weight: bold;">saved</span>
            </label>
          </div>
        </div>

        <div class="footer-links">
          <a href="https://joo.kie.sk/?page_id=384" target="_blank">homepage</a><span>|</span><a href="https://joo.kie.sk/?page_id=415" target="_blank">manual</a><span>|</span><a href="credits.html">credits</a>
        </div>
    </div>

    <div id="new-image-overlay">
      <div class="new-image-dialog">
        <strong>Create empty image (.st)</strong>
        <label><span>Tracks</span>
          <select id="new-image-tracks">
            <option selected>80</option><option>81</option>
          </select>
        </label>
        <label><span>Sectors</span>
          <select id="new-image-sectors">
            <option>8</option><option selected>9</option><option>10</option><option>11</option>
          </select>
        </label>
        <label><span>Sides</span>
          <select id="new-image-sides">
            <option>1</option><option selected>2</option>
          </select>
        </label>
        <label><span>File name</span>
          <input type="text" id="new-image-name" value="empty.st" autocomplete="off">
        </label>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="width: 70px; flex-shrink: 0;">Folder</span>
          <div id="new-image-folder"></div>
          <button onclick="showSelector(true, newImageFolder)">Browse</button>
        </div>
        <label>
          <input type="checkbox" id="new-image-insert" checked style="margin: 0;">
          Insert after create
        </label>
        <div id="new-image-error"></div>
        <div style="display: flex; justify-content: flex-end; gap: 10px;">
          <button onclick="closeNewImageDialog()">Cancel</button>
          <button onclick="createNewImage(false)">Create</button>
        </div>
      </div>
    </div>

    <div class="container-file-selector">
      <div class="file-selector" name="file-selector">
        <div class="top-bar">
          <div class="path" id="currentPath">/home/user/folder</div>
          <button onclick="goUp()">Up</button>
        </div>

        <div class="search-bar">
          <input type="search" id="search" placeholder="Search in this folder..." oninput="onSearchInput()" autocomplete="off">
        </div>

        <div class="item-list" id="itemList">
          <!-- List items will be loaded here -->
        </div>

        <div class="bottom-bar">
          <button onclick="onSelectorCancel()">Cancel</button>
          <button id="selector-ok" onclick="onSelectorOK()">OK</button>
        </div>
      </div>
    </div>

<script src="/js/server_check.js"></script>
</body>
</html>
